title: markbreitenbach.dev
tagline: Operating notes on running engineering teams made of agents.
description: >-
  Several decades of systems administration, architecture and management. Now
  running an engineering team that is mostly agents, and recording what works,
  what did not, and what I had to change.
url: "https://markbreitenbach.dev"
baseurl: ""
author:
  name: Mark Breitenbach

lang: en

# Default social card. jekyll-seo-tag reads image: only from a page, never from the site,
# so it goes in as a front matter default; a note may override with image: of its own.
defaults:
  - scope:
      path: ""
    values:
      image: /assets/img/card.jpg

# Notes live in _posts and publish at /notes/<slug>/
permalink: /notes/:title/

# Home page pagination (_plugins/home_pagination.rb): notes per page; later pages at /page/<n>/
home_per_page: 5

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - _talks-stub.html.disabled
  - README.md
  - CLAUDE.md
  - TOPICS.md
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - .claude/
  - .wrangler/
  - tools/
