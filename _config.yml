title: markbreitenbach.dev
tagline: Operating notes on running engineering teams made of agents.
description: >-
  Several decades of systems administration, architecture and management. Now
  running an engineering team that is mostly agents, and recording what works,
  what did not, and what I had to change.
url: "https://markbreitenbach.dev"
baseurl: ""
author:
  name: Mark Breitenbach

# Default social card (jekyll-seo-tag); a note may override with image: in front matter
image: /assets/img/card.jpg
lang: en

# Notes live in _posts and publish at /notes/<slug>/
permalink: /notes/:title/

markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

exclude:
  - _talks-stub.html.disabled
  - README.md
  - Gemfile
  - Gemfile.lock
  - .ruby-version
  - .claude/
  - .wrangler/
